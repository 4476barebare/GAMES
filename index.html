<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Mahjong Arena ver.0</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="badge">ver.0</span>
      <h1>AI Mahjong Arena</h1>
    </div>
    <div class="topbar-actions">
      <button id="btn-new-game" class="btn btn-primary">新規対局</button>
      <button id="btn-show-md" class="btn btn-secondary">盤面MD確認</button>
      <button id="btn-settings" class="btn btn-secondary">設定 / APIキー</button>
    </div>
  </header>

  <main class="arena">
    <!-- 卓エリア -->
    <section class="table-board" aria-label="麻雀卓">
      <!-- 相手プレイヤー領域（Seat 1） -->
      <div class="player-zone opponent-zone" id="opponent-zone">
        <div class="player-header">
          <div class="player-meta">
            <span class="wind-tag" id="opp-wind">南</span>
            <strong id="opp-name">Gemini</strong>
            <span class="points" id="opp-points">25,000</span>
            <span class="riichi-badge hidden" id="opp-riichi">リーチ中</span>
          </div>
          <div class="ai-status" id="opp-status">待機中</div>
        </div>
        <div class="ai-bubble" id="opp-bubble">
          <div class="talk" id="opp-talk">「よろしくお願いします！」</div>
          <details class="thought-box">
            <summary>AIの思考ログ（心の声）</summary>
            <p id="opp-thought">対局開始待ち</p>
          </details>
        </div>
        <div class="hand-row opponent-hand" id="opp-hand"></div>
      </div>

      <!-- 中央情報＆河（捨て牌） -->
      <div class="center-field">
        <div class="river opponent-river" id="opp-river"></div>

        <div class="center-hud">
          <div class="round-info">
            <span id="round-label">東1局 0本場</span>
            <span id="wall-count">残り山: --</span>
            <span id="riichi-sticks">供託: 0</span>
          </div>
          <div class="dora-box">
            <span>ドラ表示:</span>
            <div id="dora-indicators" class="mini-tiles"></div>
          </div>
          <div class="turn-banner" id="turn-banner">対局準備中</div>
        </div>

        <div class="river self-river" id="self-river"></div>
      </div>

      <!-- 自分プレイヤー領域（Seat 0） -->
      <div class="player-zone self-zone" id="self-zone">
        <div class="ai-bubble self-bubble hidden" id="self-bubble">
          <div class="talk" id="self-talk"></div>
          <details class="thought-box">
            <summary>AIの思考ログ</summary>
            <p id="self-thought"></p>
          </details>
        </div>

        <div class="action-bar" id="action-bar">
          <div class="shanten-info" id="shanten-info">シャンテン: -</div>
          <div class="action-buttons" id="action-buttons"></div>
        </div>

        <div class="hand-row self-hand" id="self-hand"></div>

        <div class="player-header">
          <div class="player-meta">
            <span class="wind-tag" id="self-wind">東</span>
            <strong id="self-name">あなた</strong>
            <span class="points" id="self-points">25,000</span>
            <span class="riichi-badge hidden" id="self-riichi">リーチ中</span>
          </div>
          <label class="toggle-inline">
            <input type="checkbox" id="chk-open-hand" />
            相手の手牌を公開（観戦・テスト用）
          </label>
        </div>
      </div>
    </section>

    <!-- サイドログ -->
    <aside class="side-panel">
      <h2>対局ログ</h2>
      <div class="log-list" id="game-log"></div>
    </aside>
  </main>

  <!-- 設定モーダル -->
  <dialog id="settings-modal" class="modal">
    <form method="dialog" class="modal-card" id="settings-form">
      <h2>対局・APIキー設定（BYOK）</h2>
      <p class="hint">APIキーはブラウザの localStorage にのみ保存され、外部サーバーには送信されません。未入力でも内蔵簡易AIでテストプレイ可能です。</p>

      <label class="field">
        <span>Gemini API Key</span>
        <input type="password" id="input-api-key" placeholder="AIzaSy..." autocomplete="off" />
      </label>

      <div class="field-grid">
        <label class="field">
          <span>対戦モード</span>
          <select id="select-match-mode">
            <option value="human_vs_ai">人間 vs AI（2人打ち）</option>
            <option value="ai_vs_ai">AI vs AI（オート観戦・テスト用）</option>
          </select>
        </label>

        <label class="field">
          <span>山牌セット</span>
          <select id="select-tileset">
            <option value="full136">標準136枚</option>
            <option value="2p_compact">2人用コンパクト108枚（2m-8m抜き）</option>
          </select>
        </label>
      </div>

      <div class="field-grid">
        <label class="field">
          <span>対面AI（Seat 1）モデル</span>
          <select id="select-opp-model">
            <option value="gemini-4-hydrogen">Gemini 4 Hydrogen（高速・低コスト）</option>
            <option value="gemini-4-neon">Gemini 4 Neon（高精度・ガチ思考）</option>
            <option value="gemini-2.5-flash">Gemini 2.5 Flash（互換）</option>
            <option value="builtin">内蔵ルールベースAI（API不要）</option>
          </select>
        </label>

        <label class="field">
          <span>対面AI 性格・打ち筋</span>
          <select id="select-opp-persona"></select>
        </label>
      </div>

      <label class="field">
        <span>カスタム作戦指示（任意）</span>
        <input type="text" id="input-custom-prompt" placeholder="例：染め手（混一色・清一色）を積極的に狙って！" />
      </label>

      <div class="modal-footer">
        <button type="button" id="btn-close-settings" class="btn btn-secondary">閉じる</button>
        <button type="submit" class="btn btn-primary">保存して新規対局</button>
      </div>
    </form>
  </dialog>

  <!-- 局結果モーダル -->
  <dialog id="result-modal" class="modal">
    <div class="modal-card">
      <h2 id="result-title">終局</h2>
      <div id="result-body" class="result-body"></div>
      <div class="modal-footer">
        <button type="button" id="btn-next-round" class="btn btn-primary">次の局へ</button>
      </div>
    </div>
  </dialog>

  <!-- Markdown確認モーダル -->
  <dialog id="md-modal" class="modal">
    <div class="modal-card modal-wide">
      <h2>AI送信用の盤面Markdownプレビュー</h2>
      <textarea id="md-preview-text" readonly rows="20"></textarea>
      <div class="modal-footer">
        <button type="button" id="btn-copy-md" class="btn btn-secondary">コピー</button>
        <button type="button" id="btn-close-md" class="btn btn-primary">閉じる</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
